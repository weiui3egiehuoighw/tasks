  var lastDeletedTask = null;
  var undoHideTimer = null;

  function deleteTask(id){
    var idx = state.tasks.findIndex(function(x){ return x.id === id; });
    if(idx===-1) return;
    var removed = state.tasks[idx];
    state.tasks.splice(idx, 1);
    state.tombstones = (state.tombstones||[]).concat([{id:removed.id, deletedAt: nowIso()}]);
    lastDeletedTask = removed;
    saveTasks(); closeModal(); renderAll();
    showUndoToast(removed.title);
  }
  function showUndoToast(title){
    var existing = document.getElementById('undo-toast');
    if(existing) existing.remove();
    if(undoHideTimer) clearTimeout(undoHideTimer);
    var toast = document.createElement('div');
    toast.id = 'undo-toast';
    toast.className = 'undo-toast';
    toast.innerHTML = '<span>🗑️「'+escapeHtml(title)+'」を削除しました</span><button id="undo-btn" type="button">元に戻す</button>';
    document.body.appendChild(toast);
    undoHideTimer = setTimeout(function(){ toast.remove(); lastDeletedTask = null; }, 6000);
    document.getElementById('undo-btn').addEventListener('click', function(){
      clearTimeout(undoHideTimer);
      toast.remove();
      undoDelete();
    });
  }
  function undoDelete(){
    if(!lastDeletedTask) return;
    var task = lastDeletedTask;
    lastDeletedTask = null;
    task.updatedAt = nowIso(); // 復元も更新として記録し、マージ時に復元が優先されるようにする
    state.tasks.push(task);
    state.tombstones = (state.tombstones||[]).filter(function(tb){ return tb.id !== task.id; });
    saveTasks(); renderAll();
  }
  function updateTask(id, patch){
    var t = state.tasks.find(function(t){ return t.id === id; });
    if(!t) return;
    Object.assign(t, patch, {updatedAt: nowIso()});
    saveTasks(); renderAll();
  }

  function filteredTasks(){
    return state.tasks.filter(function(t){
      if(t.archived) return false; // アーカイブ済みはカレンダー・検索・日別一覧には出さない（ボード側は別途「アーカイブを見る」から確認できる）
      if(state.filter!=='all' && t.type!==state.filter) return false;
      if(state.search){
        var hay = ((t.title||'') + ' ' + (t.note||'')).toLowerCase();
        if(hay.indexOf(state.search) === -1) return false;
      }
      return true;
    });
  }

  /* ---------- Japanese public holidays ----------
     内閣府「国民の祝日」データ(1955〜2027年分)と突き合わせ検証済み。
     2015〜2027年の範囲は振替休日・国民の休日・移動祝日・春分秋分日を含めて完全一致を確認した。
     以下の歴史的な例外のみ既知の対応範囲外（アプリの実用上の対象年ではないため）:
       - 2000年以前の海の日・敬老の日の日付移動、天皇誕生日(12/23, 平成期)
       - 2019年の即位関連の特別な祝日・休日
     2020年・2021年の東京オリンピック特例（海の日・スポーツの日・山の日の移動）は
     直近の実年であるため、下記でハードコードして対応している。 */
  var holidayCache = {};
  function nthMonday(year, month, n){
    var d = new Date(year, month, 1);
    var offset = (1 - d.getDay() + 7) % 7;
    return new Date(year, month, 1 + offset + (n-1)*7);
  }
  function equinoxDay(year, isVernal){
    var factor = isVernal ? 20.8431 : 23.2488;
    return Math.floor(factor + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  }
  // 2020年・2021年は東京オリンピック・パラリンピック特別措置法により
  // 海の日・スポーツの日・山の日が例年と異なる日付に移動した（内閣府公表の特例）。
  var OLYMPIC_SPECIAL_DATES = {
    2020: { umi: [7,23], supo: [7,24], yama: [8,10] },
    2021: { umi: [7,22], supo: [7,23], yama: [8,8] }
  };
  function baseHolidaysForYear(year){
    var map = {};
    function add(m,d,name){ map[year+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')] = name; }
    var special = OLYMPIC_SPECIAL_DATES[year];
    add(1,1,'元日');
    var seijin = nthMonday(year,0,2); add(1, seijin.getDate(), '成人の日');
    add(2,11,'建国記念の日');
    if(year>=2020) add(2,23,'天皇誕生日');
    add(3, equinoxDay(year,true), '春分の日');
    add(4,29,'昭和の日');
    add(5,3,'憲法記念日'); add(5,4,'みどりの日'); add(5,5,'こどもの日');
    if(special){ add(special.umi[0], special.umi[1], '海の日'); }
    else { var umi = nthMonday(year,6,3); add(7, umi.getDate(), '海の日'); }
    if(year>=2016){
      if(special){ add(special.yama[0], special.yama[1], '山の日'); }
      else { add(8,11,'山の日'); } // 山の日は2016年に新設された祝日
    }
    var keirou = nthMonday(year,8,3); add(9, keirou.getDate(), '敬老の日');
    add(9, equinoxDay(year,false), '秋分の日');
    if(special){ add(special.supo[0], special.supo[1], 'スポーツの日'); }
    else { var supo = nthMonday(year,9,2); add(10, supo.getDate(), 'スポーツの日'); }
    add(11,3,'文化の日'); add(11,23,'勤労感謝の日');
    return map;
  }
  function jpHolidayMapForYear(year){
    if(holidayCache[year]) return holidayCache[year];
    var merged = {};
    [year-1, year, year+1].forEach(function(y){
      Object.assign(merged, baseHolidaysForYear(y));
    });
    // substitute holiday: a holiday on Sunday pushes to the next non-holiday day
    var subs = {};
    Object.keys(merged).forEach(function(ds){
      var d = new Date(ds+'T00:00:00');
      if(d.getDay()===0){
        var next = new Date(d.getTime());
        do{ next.setDate(next.getDate()+1); }
        while(merged[fmtDate(next)] || subs[fmtDate(next)]);
        subs[fmtDate(next)] = '振替休日';
      }
    });
    Object.assign(merged, subs);
    // citizen's holiday: a weekday sandwiched between two holidays
    var citizen = {};
    Object.keys(merged).forEach(function(ds){
      var d = new Date(ds+'T00:00:00');
      var next = new Date(d.getTime()); next.setDate(next.getDate()+1);
      var nextStr = fmtDate(next);
      if(!merged[nextStr] && !citizen[nextStr]){
        var afterNext = new Date(next.getTime()); afterNext.setDate(afterNext.getDate()+1);
        if(merged[fmtDate(afterNext)]) citizen[nextStr] = '国民の休日';
      }
    });
    Object.assign(merged, citizen);
    holidayCache[year] = merged;
    return merged;
  }
  function isJPHoliday(date){
    var map = jpHolidayMapForYear(date.getFullYear());
    return !!map[fmtDate(date)];
  }
  function isNonBusinessDay(date){
    var wd = date.getDay();
    return wd===0 || wd===6 || isJPHoliday(date);
  }
  function adjustForBusinessDay(date, mode){
    if(mode!=='before' && mode!=='after') return date;
    var d = new Date(date.getTime());
    var step = mode==='before' ? -1 : 1;
    var guard = 0;
    while(isNonBusinessDay(d) && guard < 14){ d.setDate(d.getDate()+step); guard++; }
    return d;
  }

  // occursOn: 指定した日付にタスクが「発生する日」かどうかを判定する純粋な日付計算。
  // なるはや(urgent)フラグによる「カレンダーには出さない」という表示上の除外は、
  // ここでは行わない。以前はここで一律 return false していたため、なるはや かつ
  // 繰り返しのタスクは occursOn を内部で使う nextPendingOccurrence が常にnullを返し、
  // 「なるはや」欄・ボードの次回表示・編集画面の次回発生日が常に空になってしまっていた。
  // カレンダー月表示・日別一覧など「カレンダー画面」側でなるはやを除外したい箇所は、
  // 呼び出し側で明示的に t.urgent を見て除外する。
  function occursOn(task, dateStr){
    if(task.repeat!=='none'){
      if(task.repeatStart && dateStr < task.repeatStart) return false;
      if(task.repeatEnd && dateStr > task.repeatEnd) return false;
    }
    var d = new Date(dateStr+'T00:00:00');
    var weekday = d.getDay();
    if(task.repeat==='daily') return true;
    if(task.repeat==='weekly') return (task.weekdays||[]).indexOf(weekday) !== -1;
    if(task.repeat==='monthly'){
      var y = d.getFullYear(), m = d.getMonth();
      var daysInMonth = new Date(y,m+1,0).getDate();
      var nominalDay = Math.min(task.monthDay||1, daysInMonth);
      var nominal = new Date(y,m,nominalDay);
      var adjusted = adjustForBusinessDay(nominal, task.monthAdjust||'none');
      return fmtDate(adjusted) === dateStr;
    }
    return task.date === dateStr;
  }

  /* ---------- Occurrence-based completion (繰り返しタスクは日付ごとに完了管理) ---------- */
  function isOccurrenceDone(task, dateStr){
    if(task.repeat==='none') return task.status==='done';
    var rec = (task.doneMap||{})[dateStr];
    return !!(rec && rec.done);
  }
  // 現在「完了」になっている日付だけを配列で返す(完了履歴の表示用)
  function doneDatesOf(task){
    var map = task.doneMap || {};
    return Object.keys(map).filter(function(d){ return map[d] && map[d].done; });
  }
  function setOccurrenceDone(id, dateStr, done){
    var t = state.tasks.find(function(x){ return x.id===id; });
    if(!t) return;
    if(t.repeat==='none'){
      updateTask(id, {status: done ? 'done' : 'todo'});
      return;
    }
    // atに「今この操作をした時刻」を記録しておくことで、同期時のマージで
    // 完了/取り消しのどちらがあとから行われた操作かを正しく判定できるようにする。
    var map = Object.assign({}, t.doneMap||{});
    map[dateStr] = {done: done, at: nowIso()};
    updateTask(id, {doneMap: map});
  }
  // 今日以降で、まだ完了していない直近の発生日を探す（繰り返しタスク用）。単発タスクはtask.dateかnullを返す。
  function nextPendingOccurrence(task, maxDays){
    maxDays = maxDays || 400;
    if(task.repeat==='none'){
      return task.status==='done' ? null : (task.date || null);
    }
    var today = new Date(); today.setHours(0,0,0,0);
    for(var i=0;i<=maxDays;i++){
      var d = new Date(today); d.setDate(d.getDate()+i);
      var ds = fmtDate(d);
      if(occursOn(task, ds) && !isOccurrenceDone(task, ds)) return ds;
    }
    return null;
  }

  /* ---------- Urgent panel ---------- */
  function renderUrgent(){
    var root = document.getElementById('urgent-list');
    var urgents = [];
    state.tasks.forEach(function(t){
      if(!t.urgent) return;
      var occDate = nextPendingOccurrence(t, 400);
      if(t.repeat==='none' && t.status==='done') return; // 完了済みの単発タスクは非表示
      if(t.repeat!=='none' && !occDate) return; // 発生期間が終了し、これ以上の予定がない
      urgents.push({task:t, date:occDate});
    });
    urgents.sort(function(a,b){
      if(a.date && b.date) return a.date.localeCompare(b.date);
      if(a.date) return -1;
      if(b.date) return 1;
      return 0;
    });
    if(urgents.length===0){
      root.innerHTML = '<div class="urgent-empty">なるはやタスクはありません</div>';
      return;
    }
    var html = '';
    urgents.forEach(function(it){
      var t = it.task;
      html += '<div class="urgent-row" data-taskid="'+t.id+'">';
      html += '<span class="dot t-'+t.type+'"></span>';
      if(t.repeat!=='none') html += '<span class="badge repeat">🔁</span>';
      html += '<span class="ut">'+escapeHtml(t.title)+'</span>';
      if(it.date) html += '<span class="ud">'+(t.repeat!=='none'?'次回 ':'')+it.date+'</span>';
      html += '<button class="done-btn" data-quickdone="'+t.id+'">✅完了</button>';
      html += '</div>';
    });
    root.innerHTML = html;
    root.querySelectorAll('[data-quickdone]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var id = b.getAttribute('data-quickdone');
        var it = urgents.find(function(x){ return x.task.id===id; });
        setOccurrenceDone(id, (it && it.date) || todayStr(), true);
      });
    });
    root.querySelectorAll('.urgent-row').forEach(function(row){
      row.addEventListener('click', function(){
        openModal(row.getAttribute('data-taskid'));
      });
    });
  }

  /* ---------- Soon panel (直近のタスク) ---------- */
  function renderSoon(){
    var root = document.getElementById('soon-list');
    var today = new Date(); today.setHours(0,0,0,0);
    var horizon = 7;
    var items = [];
    state.tasks.forEach(function(t){
      if(t.urgent) return; // なるはやタスクは専用の「なるはや」欄に出すため、ここには出さない
      for(var i=0;i<=horizon;i++){
        var d = new Date(today); d.setDate(d.getDate()+i);
        var ds = fmtDate(d);
        if(occursOn(t, ds) && !isOccurrenceDone(t, ds)){
          items.push({task:t, dateStr:ds, offset:i});
          break; // 期間内でまだ完了していない直近の発生日だけ拾う
        }
      }
    });
    items.sort(function(a,b){
      if(a.offset !== b.offset) return a.offset - b.offset;
      return (a.task.urgent?0:1) - (b.task.urgent?0:1);
    });
    if(items.length===0){
      root.innerHTML = '<div class="soon-empty">直近7日以内の予定はありません</div>';
      return;
    }
    var html = '';
    items.forEach(function(it){
      var t = it.task;
      var isToday = it.offset===0;
      var dayTag = isToday ? '今日' : (it.offset===1 ? '明日' : it.offset+'日後');
      html += '<div class="soon-row'+(isToday?' is-today':'')+'" data-taskid="'+t.id+'">';
      html += '<span class="badge-daytag'+(isToday?' today':'')+'">'+dayTag+'</span>';
      html += '<span class="dot t-'+t.type+'"></span>';
      html += '<span class="ut">'+escapeHtml(t.title)+'</span>';
      html += '<span class="ud">'+it.dateStr+'</span>';
      html += '<button class="done-btn" data-quickdone="'+t.id+'" data-quickdate="'+it.dateStr+'">✅完了</button>';
      html += '</div>';
    });
    root.innerHTML = html;
    root.querySelectorAll('[data-quickdone]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        setOccurrenceDone(b.getAttribute('data-quickdone'), b.getAttribute('data-quickdate'), true);
      });
    });
    root.querySelectorAll('.soon-row').forEach(function(row){
      row.addEventListener('click', function(){
        openModal(row.getAttribute('data-taskid'));
      });
    });
  }

  /* ---------- Calendar ---------- */
  var lastRenderedCalKey = null;
  function renderCalendar(){
    var root = document.getElementById('view-root');
    var y = state.calDate.getFullYear(), m = state.calDate.getMonth();
    var firstDay = new Date(y,m,1).getDay();
    var daysInMonth = new Date(y,m+1,0).getDate();
    var daysInPrev = new Date(y,m,0).getDate();
    var cells = [];
    for(var i=firstDay-1;i>=0;i--){
      var prevD = new Date(y, m, -i);
      cells.push({day:prevD.getDate(), muted:true, dateStr: fmtDate(prevD), jumpYear: prevD.getFullYear(), jumpMonth: prevD.getMonth()});
    }
    for(var d=1; d<=daysInMonth; d++){
      cells.push({day:d, muted:false, dateStr: y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')});
    }
    var nextDay=1;
    while(cells.length % 7 !== 0){
      var nextD = new Date(y, m+1, nextDay);
      cells.push({day:nextD.getDate(), muted:true, dateStr: fmtDate(nextD), jumpYear: nextD.getFullYear(), jumpMonth: nextD.getMonth()});
      nextDay++;
    }

    var tasks = filteredTasks();
    var today = todayStr();
    var html = '';
    var calKey = y+'-'+m;
    var animCls = (calKey !== lastRenderedCalKey) ? ' cal-fade-anim' : '';
    lastRenderedCalKey = calKey;
    html += '<div class="cal-fade'+animCls+'">';
    html += '<div class="cal-nav"><button id="prev-month">‹</button><div class="month-label">'+y+'年 '+(m+1)+'月</div><button id="next-month">›</button></div>';
    html += '<div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>';
    html += '<div class="cal-grid">';
    cells.forEach(function(c){
      if(c.muted){
        html += '<div class="cal-cell muted" data-jumpcell="'+c.dateStr+'" data-jumpyear="'+c.jumpYear+'" data-jumpmonth="'+c.jumpMonth+'"><span class="cal-daynum">'+c.day+'</span></div>';
        return;
      }
      var isToday = c.dateStr === today;
      var cellDateObj = new Date(c.dateStr+'T00:00:00');
      var wd = cellDateObj.getDay();
      var isHoliday = isJPHoliday(cellDateObj);
      var dayCls = '';
      if(wd===0 || isHoliday) dayCls = ' sun';
      else if(wd===6) dayCls = ' sat';
      var dayTasks = tasks.filter(function(t){ return !t.urgent && occursOn(t, c.dateStr); });
      var isSelected = state.selectedDate === c.dateStr;
      html += '<div class="cal-cell'+(isToday?' today':'')+dayCls+(isSelected?' selected':'')+'" data-daycell="'+c.dateStr+'">';
      html += '<span class="cal-daynum">'+c.day+'</span>';
      html += '<div class="dot-row">';
      dayTasks.slice(0,8).forEach(function(t){
        var cls = 'dot t-'+t.type + (isOccurrenceDone(t, c.dateStr)?' done':'') + (t.repeat!=='none'?' repeat':'');
        html += '<span class="'+cls+'"></span>';
      });
      if(dayTasks.length>8) html += '<span class="more-num" data-morecell="'+c.dateStr+'">+'+(dayTasks.length-8)+'</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
    root.innerHTML = html;

    document.getElementById('prev-month').onclick = function(){ state.calDate = new Date(y, m-1, 1); state.selectedDate = null; renderCalendar(); };
    document.getElementById('next-month').onclick = function(){ state.calDate = new Date(y, m+1, 1); state.selectedDate = null; renderCalendar(); };
    root.querySelectorAll('[data-daycell]').forEach(function(cell){
      cell.addEventListener('click', function(){
        var ds = cell.getAttribute('data-daycell');
        if(isTouchUI && state.selectedDate === ds){ openDayModal(ds); return; }
        state.selectedDate = (state.selectedDate === ds) ? null : ds;
        renderCalendar();
      });
      cell.addEventListener('dblclick', function(){
        if(isTouchUI || document.querySelector('.overlay')) return;
        openDayModal(cell.getAttribute('data-daycell'));
      });
    });
    root.querySelectorAll('[data-morecell]').forEach(function(more){
      more.addEventListener('click', function(e){
        e.stopPropagation();
        openDayModal(more.getAttribute('data-morecell'));
      });
    });
    root.querySelectorAll('[data-jumpcell]').forEach(function(cell){
      cell.addEventListener('click', function(){
        var jy = parseInt(cell.getAttribute('data-jumpyear'),10);
        var jm = parseInt(cell.getAttribute('data-jumpmonth'),10);
        state.calDate = new Date(jy, jm, 1);
        state.selectedDate = cell.getAttribute('data-jumpcell');
        renderCalendar();
      });
    });
  }

  function openDayModal(dateStr){
    document.querySelectorAll('.overlay').forEach(function(o){ o.remove(); }); // 連続タップで二重に開かないように
    var tasks = filteredTasks().filter(function(t){ return !t.urgent && occursOn(t, dateStr); });
    var overlay = newOverlay('day-overlay');
    var html = '<div class="modal">';
    html += '<h2>'+dateStr+'</h2>';
    html += '<div class="day-list">';
    if(tasks.length===0){
      html += '<div class="empty-note">この日の予定はありません</div>';
    }
    tasks.forEach(function(t){
      var done = isOccurrenceDone(t, dateStr);
      html += '<div class="day-item" data-openid="'+t.id+'">';
      html += typeBadgeHtml(t, true);
      html += '<span class="dit'+(done?' done':'')+'">'+escapeHtml(t.title)+'</span>';
      if(t.repeat!=='none') html += '<span class="badge repeat">🔁繰返</span>';
      html += '<button class="done-btn" data-daydone="'+t.id+'" style="margin-left:auto;">'+(done?'↺戻す':'✅完了')+'</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="modal-actions"><div></div><div class="right"><button class="btn-secondary" id="day-close">閉じる</button><button class="btn-primary" id="day-add">この日に追加</button></div></div>';
    html += '</div>';
    overlay.innerHTML = html;
    finalizeOverlay(overlay);
    document.getElementById('day-close').addEventListener('click', function(){ overlay.remove(); });
    document.getElementById('day-add').addEventListener('click', function(){ overlay.remove(); openModal(null, dateStr); });
    overlay.querySelectorAll('[data-openid]').forEach(function(item){
      item.addEventListener('click', function(){ overlay.remove(); openModal(item.getAttribute('data-openid')); });
    });
    overlay.querySelectorAll('[data-daydone]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-daydone');
        var t = state.tasks.find(function(x){ return x.id === id; });
        if(!t) return;
        setOccurrenceDone(id, dateStr, !isOccurrenceDone(t, dateStr));
        overlay.remove();
        openDayModal(dateStr);
      });
    });
  }

  /* ---------- Board ---------- */
  function renderBoard(){
    var root = document.getElementById('view-root');
    var tasks = filteredTasks();
    var archivedCount = state.tasks.filter(function(t){ return t.status==='done' && t.archived; }).length;
    var html = '<div class="board">';
    STATUS.forEach(function(col){
      var colTasks = tasks.filter(function(t){ return t.status === col.key && !t.archived; });
      html += '<div class="board-col col-'+col.key+'"><h3>'+col.icon+' '+col.label+'<span class="col-count">'+colTasks.length+'</span></h3>';
      if(col.key==='done' && archivedCount>0){
        html += '<button class="archive-link" id="open-archive-btn" type="button">📦 アーカイブを見る（'+archivedCount+'件）</button>';
      }
      if(colTasks.length===0) html += '<div class="empty-note">なし</div>';
      colTasks.forEach(function(t){
        var isRepeat = t.repeat !== 'none';
        var todayDs = todayStr();
        var repeatActiveToday = isRepeat && occursOn(t, todayDs);
        var doneNow = isRepeat ? (repeatActiveToday && isOccurrenceDone(t, todayDs)) : (t.status==='done');
        html += '<div class="task-card'+(doneNow?' is-done':'')+'" data-cardid="'+t.id+'">';
        if(doneNow) html += '<div class="hanko-mark">✨</div>';
        if(!isRepeat){
          html += '<button class="card-done-toggle" data-toggledone="'+t.id+'" title="'+(doneNow?'未完了に戻す':'完了にする')+'">'+(doneNow?'↺':'✓')+'</button>';
        } else if(repeatActiveToday){
          html += '<button class="card-done-toggle" data-toggledone="'+t.id+'" data-toggledate="'+todayDs+'" title="'+(doneNow?'今日の分を未完了に戻す':'今日の分を完了にする')+'">'+(doneNow?'↺':'✓')+'</button>';
        }
        html += '<p class="tt">'+escapeHtml(t.title)+'</p>';
        // ②今日やるべきか／期限：タイトルの直下に、バッジではなく文字情報として表示
        if(isRepeat){
          if(repeatActiveToday){
            html += '<div class="card-when'+(doneNow?' done-emph':' emph')+'">'+(doneNow?'✅ 今日の分は完了':'📌 今日が対象日')+'</div>';
          } else {
            var nextOcc = nextPendingOccurrence(t, 400);
            if(nextOcc) html += '<div class="card-when">次回 '+nextOcc+'</div>';
          }
        } else if(t.date){
          var isDateToday = t.date === todayDs;
          html += '<div class="card-when'+(isDateToday && !doneNow ? ' emph' : '')+'">📅 '+t.date+(isDateToday?'（今日）':'')+'</div>';
        }
        html += '<div class="task-meta">';
        html += typeBadgeHtml(t, false);
        if(t.urgent) html += '<span class="mini-icon-badge urgent" title="なるはや（優先表示タスク）">⏰</span>';
        if(isRepeat) html += '<span class="mini-icon-badge repeat" title="繰り返しタスク">🔁</span>';
        html += '</div>';
        if(col.key==='done' && !isRepeat){
          html += '<button class="archive-btn" data-archiveid="'+t.id+'">📦 アーカイブする</button>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    root.innerHTML = html;
    root.querySelectorAll('[data-cardid]').forEach(function(card){
      card.addEventListener('click', function(){ openModal(card.getAttribute('data-cardid')); });
    });
    root.querySelectorAll('[data-toggledone]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-toggledone');
        var t = state.tasks.find(function(x){ return x.id === id; });
        if(!t) return;
        var ds = btn.getAttribute('data-toggledate');
        if(ds){
          setOccurrenceDone(id, ds, !isOccurrenceDone(t, ds));
        } else {
          updateTask(id, {status: t.status==='done' ? 'todo' : 'done'});
        }
      });
    });
    root.querySelectorAll('[data-archiveid]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        updateTask(btn.getAttribute('data-archiveid'), {archived:true});
      });
    });
    var openArchiveBtn = document.getElementById('open-archive-btn');
    if(openArchiveBtn) openArchiveBtn.addEventListener('click', function(e){ e.stopPropagation(); openArchiveModal(); });
  }

  /* ---------- アーカイブ一覧 ---------- */
  function openArchiveModal(){
    document.querySelectorAll('.overlay').forEach(function(o){ o.remove(); }); // 連続タップで二重に開かないように
    var archived = state.tasks.filter(function(t){ return t.status==='done' && t.archived; })
      .sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
    var overlay = newOverlay('archive-overlay');
    var html = '<div class="modal">';
    html += '<h2>📦 アーカイブ済みタスク（'+archived.length+'件）</h2>';
    html += '<div class="day-list">';
    if(archived.length===0){
      html += '<div class="empty-note">アーカイブ済みのタスクはありません</div>';
    }
    archived.forEach(function(t){
      html += '<div class="day-item">';
      html += typeBadgeHtml(t, true);
      html += '<span class="dit done">'+escapeHtml(t.title)+'</span>';
      html += '<button class="done-btn" data-unarchive="'+t.id+'" style="margin-left:auto;">↺戻す</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="modal-actions"><div></div><div class="right"><button class="btn-secondary" id="archive-close">閉じる</button></div></div>';
    html += '</div>';
    overlay.innerHTML = html;
    finalizeOverlay(overlay);
    document.getElementById('archive-close').addEventListener('click', function(){ overlay.remove(); });
    overlay.querySelectorAll('[data-unarchive]').forEach(function(btn){
      btn.addEventListener('click', function(){
        updateTask(btn.getAttribute('data-unarchive'), {archived:false});
        overlay.remove();
        openArchiveModal();
      });
    });
  }

  function renderAll(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view')===state.view); });
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-filter')===state.filter); });
    renderUrgent();
    renderSoon();
    if(state.view==='calendar') renderCalendar(); else renderBoard();
  }

  /* ---------- Modal (add/edit single task) ---------- */
  function openModal(id, prefillDate){
    document.querySelectorAll('.overlay').forEach(function(o){ o.remove(); }); // 連続タップで二重に開かないように
    var t = id ? state.tasks.find(function(x){return x.id===id;}) : null;
    var isNew = !t;
    var overlay = newOverlay('modal-overlay');

    var title = isNew ? '' : t.title;
    var type = isNew ? 'must' : t.type;
    var repeat = isNew ? 'none' : t.repeat;
    var status = isNew ? 'todo' : ((repeat!=='none' && t.status==='done') ? 'todo' : t.status);
    var date = isNew ? (prefillDate || '') : (t.date || '');
    var note = isNew ? '' : (t.note || '');
    var urgent = isNew ? false : t.urgent;
    var weekdays = isNew ? [] : (t.weekdays||[]).slice();
    var monthDay = isNew ? (new Date().getDate()) : (t.monthDay || new Date().getDate());
    var monthAdjust = isNew ? 'none' : (t.monthAdjust || 'none');
    var repeatStart = isNew ? '' : (t.repeatStart || '');
    var repeatEnd = isNew ? '' : (t.repeatEnd || '');

    var html = '<div class="modal">';
    html += '<h2>'+(isNew?'タスクを追加':'タスクを編集')+'</h2>';
    html += '<div class="field"><label>タイトル</label><input type="text" id="m-title" value="'+escapeHtml(title)+'"></div>';
    html += '<div class="field"><label>種類</label><div class="type-toggle" id="m-type">';
    html += '<button data-type="must" class="'+(type==='must'?'sel-must':'')+'">📌やらなきゃ</button>';
    html += '<button data-type="want" class="'+(type==='want'?'sel-want':'')+'">🌸やりたい</button>';
    html += '</div></div>';
    html += '<div class="field"><label>状態</label><div class="status-row" id="m-status">';
    STATUS.forEach(function(s){ html += '<button data-status="'+s.key+'" class="'+(status===s.key?'sel':'')+'" style="'+(s.key==='done'&&repeat!=='none'?'display:none;':'')+'">'+s.icon+' '+s.label+'</button>'; });
    html += '</div>';
    html += '<div class="repeat-done-note" id="m-repeat-done-note" style="'+(repeat!=='none'?'':'display:none;')+'">🔁 繰り返しタスクの完了は、カレンダーの日付をダブルクリック（スマホは2回タップ）するか「直近のタスク」欄から、日付ごとに記録します。</div>';
    html += '</div>';
    if(!isNew && repeat!=='none'){
      var todayDsForStatus = todayStr();
      var activeTodayForStatus = occursOn(t, todayDsForStatus);
      var doneTodayForStatus = activeTodayForStatus && isOccurrenceDone(t, todayDsForStatus);
      var nextPendingForStatus = nextPendingOccurrence(t, 400);
      var todayLabel = !activeTodayForStatus ? '今日は対象日ではありません' : (doneTodayForStatus ? '✅ 完了済み' : '未完了');
      var rangeLabel = (t.repeatStart || '制限なし') + ' 〜 ' + (t.repeatEnd || '制限なし');
      html += '<div class="repeat-status-box">';
      html += '<div class="rsb-row"><span class="rsb-label">今日の状態</span><span class="rsb-value">'+todayLabel+'</span></div>';
      html += '<div class="rsb-row"><span class="rsb-label">次回(未完了)の発生日</span><span class="rsb-value">'+(nextPendingForStatus || 'なし（期間終了）')+'</span></div>';
      html += '<div class="rsb-row"><span class="rsb-label">繰り返し期間</span><span class="rsb-value">'+rangeLabel+'</span></div>';
      html += '</div>';
    }
    if(!isNew && repeat!=='none' && doneDatesOf(t).length>0){
      var sortedDone = doneDatesOf(t).sort().reverse();
      html += '<div class="field"><label>完了履歴（全'+sortedDone.length+'回）</label>';
      html += '<div class="history-list">'+sortedDone.slice(0,12).map(function(d){ return '<span class="history-chip">'+d+'</span>'; }).join('')+(sortedDone.length>12?'<span class="history-more">ほか'+(sortedDone.length-12)+'件</span>':'')+'</div>';
      html += '</div>';
    }
    html += '<div class="field inline-toggle"><label style="margin:0;">なるはや（優先表示タスク・繰り返しタスクにも設定可・カレンダーには出さず上部に常時表示）</label>';
    html += '<button class="toggle-pill'+(urgent?' on':'')+'" id="m-urgent">'+(urgent?'ON':'OFF')+'</button></div>';
    html += '<div class="field" id="m-date-wrap"><label>日付（任意）</label><input type="date" id="m-date" value="'+date+'"></div>';
    html += '<div class="field" id="m-repeat-wrap"><label>繰り返し</label><select id="m-repeat">';
    html += '<option value="none"'+(repeat==='none'?' selected':'')+'>なし（単発）</option>';
    html += '<option value="daily"'+(repeat==='daily'?' selected':'')+'>毎日</option>';
    html += '<option value="weekly"'+(repeat==='weekly'?' selected':'')+'>毎週</option>';
    html += '<option value="monthly"'+(repeat==='monthly'?' selected':'')+'>毎月</option>';
    html += '</select></div>';
    html += '<div class="field" id="m-weekdays-wrap" style="'+(repeat==='weekly'?'':'display:none;')+'"><label>曜日</label><div class="weekday-pills" id="m-weekdays"></div></div>';
    html += '<div class="field" id="m-monthday-wrap" style="'+(repeat==='monthly'?'':'display:none;')+'"><label>毎月の日にち</label><input type="number" id="m-monthday" min="1" max="31" value="'+monthDay+'" style="width:80px;">';
    html += '<span class="hint-inline" style="display:block;margin-top:4px;">※その月に無い日にち（31日・2月30日など）を指定した場合は、その月の最終日として扱われます</span>';
    html += '<label style="margin-top:8px;">土日祝に当たったら<select id="m-adjust" style="width:100%;margin-top:4px;">';
    html += '<option value="none"'+(monthAdjust==='none'?' selected':'')+'>そのまま</option>';
    html += '<option value="before"'+(monthAdjust==='before'?' selected':'')+'>前営業日にずらす</option>';
    html += '<option value="after"'+(monthAdjust==='after'?' selected':'')+'>翌営業日にずらす</option>';
    html += '</select></label></div>';
    html += '<div class="field" id="m-repeatrange-wrap" style="'+(repeat!=='none'?'':'display:none;')+'">';
    html += '<label>開始日（任意・空欄なら制限なし）</label><input type="date" id="m-repeat-start" value="'+repeatStart+'">';
    html += '<label style="margin-top:8px;">終了日（任意・空欄なら制限なし）</label><input type="date" id="m-repeat-end" value="'+repeatEnd+'">';
    html += '</div>';
    html += '<div class="field-error" id="m-error" style="display:none;"></div>';
    html += '<div class="field"><label>メモ</label><textarea id="m-note" placeholder="要フォローの内容など">'+escapeHtml(note)+'</textarea></div>';
    html += '<div class="modal-actions">';
    html += '<button class="btn-text danger" id="m-delete" style="'+(isNew?'visibility:hidden':'')+'">🗑️ 削除</button>';
    html += '<div class="right"><button class="btn-secondary" id="m-cancel">キャンセル</button><button class="btn-primary" id="m-save">保存</button></div>';
    html += '</div></div>';
    overlay.innerHTML = html;
    finalizeOverlay(overlay, '#m-title');

    var curType = type, curStatus = status, curUrgent = urgent, curWeekdays = weekdays;
    var wdWrap = overlay.querySelector('#m-weekdays');
    WD_LABELS.forEach(function(lbl, idx){
      var b = document.createElement('button');
      b.textContent = lbl;
      b.type='button';
      if(curWeekdays.indexOf(idx)!==-1) b.className='sel';
      b.addEventListener('click', function(){
        var pos = curWeekdays.indexOf(idx);
        if(pos===-1){ curWeekdays.push(idx); b.className='sel'; }
        else { curWeekdays.splice(pos,1); b.className=''; }
      });
      wdWrap.appendChild(b);
    });

    overlay.querySelectorAll('#m-type button').forEach(function(b){
      b.addEventListener('click', function(){
        curType = b.getAttribute('data-type');
        overlay.querySelectorAll('#m-type button').forEach(function(x){ x.className=''; });
        b.className = curType==='must' ? 'sel-must' : 'sel-want';
      });
    });
    overlay.querySelectorAll('#m-status button').forEach(function(b){
      b.addEventListener('click', function(){
        curStatus = b.getAttribute('data-status');
        overlay.querySelectorAll('#m-status button').forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      });
    });
    overlay.querySelector('#m-urgent').addEventListener('click', function(){
      curUrgent = !curUrgent;
      this.classList.toggle('on', curUrgent);
      this.textContent = curUrgent ? 'ON' : 'OFF';
    });
    overlay.querySelector('#m-repeat').addEventListener('change', function(){
      var rv = this.value;
      overlay.querySelector('#m-weekdays-wrap').style.display = rv==='weekly' ? '' : 'none';
      overlay.querySelector('#m-monthday-wrap').style.display = rv==='monthly' ? 'block' : 'none';
      overlay.querySelector('#m-repeatrange-wrap').style.display = rv!=='none' ? '' : 'none';
      var doneBtn = overlay.querySelector('#m-status button[data-status="done"]');
      var note = overlay.querySelector('#m-repeat-done-note');
      if(rv!=='none'){
        doneBtn.style.display = 'none';
        note.style.display = '';
        if(curStatus==='done'){
          curStatus = 'todo';
          overlay.querySelectorAll('#m-status button').forEach(function(x){ x.classList.remove('sel'); });
          overlay.querySelector('#m-status button[data-status="todo"]').classList.add('sel');
        }
      } else {
        doneBtn.style.display = '';
        note.style.display = 'none';
      }
      // 「毎月」に切り替えた際、上の日付欄にすでに日付が入っていれば、その日にちを
      // 「毎月の日にち」欄の初期値として引き継ぐ（例: 20日を選んでから毎月にすると20日が入る）。
      if(rv==='monthly'){
        var dateVal = overlay.querySelector('#m-date').value;
        if(dateVal) overlay.querySelector('#m-monthday').value = parseInt(dateVal.slice(8,10), 10);
      }
    });
    overlay.querySelector('#m-date').addEventListener('change', function(){
      // 毎月を選択中に日付欄を変更した場合も、毎月の日にちを追従させる。
      if(overlay.querySelector('#m-repeat').value==='monthly' && this.value){
        overlay.querySelector('#m-monthday').value = parseInt(this.value.slice(8,10), 10);
      }
    });
    overlay.querySelector('#m-cancel').addEventListener('click', closeModal);
    overlay.querySelector('#m-delete').addEventListener('click', function(){ if(!isNew) deleteTask(t.id); });
    function showModalError(msg){
      var el = overlay.querySelector('#m-error');
      el.textContent = '⚠️ ' + msg;
      el.style.display = '';
    }
    function doSave(){
      var newTitle = overlay.querySelector('#m-title').value.trim();
      if(!newTitle){ overlay.querySelector('#m-title').focus(); return; }
      var newDate = overlay.querySelector('#m-date').value || null;
      var newNote = overlay.querySelector('#m-note').value;
      var newRepeat = overlay.querySelector('#m-repeat').value;
      var newMonthDay = newRepeat==='monthly' ? clampMonthDay(overlay.querySelector('#m-monthday').value) : null;
      var newMonthAdjust = newRepeat==='monthly' ? overlay.querySelector('#m-adjust').value : 'none';
      var newRepeatStart = newRepeat!=='none' ? (overlay.querySelector('#m-repeat-start').value || null) : null;
      var newRepeatEnd = newRepeat!=='none' ? (overlay.querySelector('#m-repeat-end').value || null) : null;
      overlay.querySelector('#m-error').style.display = 'none';
      if(newRepeat==='weekly' && curWeekdays.length===0){
        showModalError('毎週の場合は曜日を1つ以上選択してください');
        return;
      }
      if(newRepeatStart && newRepeatEnd && newRepeatStart > newRepeatEnd){
        showModalError('開始日は終了日より前の日付にしてください');
        return;
      }
      var finalStatus = (newRepeat!=='none' && curStatus==='done') ? 'todo' : curStatus;
      var patch = { title:newTitle, type:curType, status:finalStatus, date:newDate, note:newNote, urgent:curUrgent, repeat:newRepeat, weekdays: newRepeat==='weekly' ? curWeekdays.slice() : [], monthDay:newMonthDay, monthAdjust:newMonthAdjust, repeatStart:newRepeatStart, repeatEnd:newRepeatEnd, updatedAt: nowIso() };
      if(isNew){
        patch.id = uid();
        patch.doneMap = {};
        patch.archived = false;
        state.tasks.push(patch);
      } else {
        Object.assign(t, patch);
      }
      saveTasks(); closeModal(); renderAll();
    }
    overlay.querySelector('#m-save').addEventListener('click', doSave);
    overlay.querySelector('#m-title').addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); doSave(); }
    });
  }
  function closeModal(){ var el = document.getElementById('modal-overlay'); if(el) el.remove(); }

  /* ---------- Add-bar controls ---------- */
  function updateRepeatControlsVisibility(){
    var repeat = document.getElementById('new-repeat').value;
    document.getElementById('new-weekdays').style.display = repeat==='weekly' ? 'flex' : 'none';
    document.getElementById('new-monthday-wrap').style.display = repeat==='monthly' ? 'inline-flex' : 'none';
    document.getElementById('new-adjust-wrap').style.display = repeat==='monthly' ? 'inline-flex' : 'none';
    document.getElementById('new-repeatstart-wrap').style.display = repeat!=='none' ? 'inline-flex' : 'none';
    document.getElementById('new-repeatend-wrap').style.display = repeat!=='none' ? 'inline-flex' : 'none';
    // 「毎月」に切り替えた際、上の日付欄にすでに日付が入っていれば、その日にちを
    // 「毎月の日にち」欄の初期値として引き継ぐ（例: 20日を選んでから毎月にすると20日が入る）。
    if(repeat==='monthly'){
      var dateVal = document.getElementById('new-date').value;
      if(dateVal){
        document.getElementById('new-monthday').value = parseInt(dateVal.slice(8,10), 10);
      }
    }
  }
  document.getElementById('new-date').addEventListener('change', function(){
    // 毎月を選択中に日付欄を変更した場合も、毎月の日にちを追従させる。
    if(document.getElementById('new-repeat').value==='monthly' && this.value){
      document.getElementById('new-monthday').value = parseInt(this.value.slice(8,10), 10);
    }
  });
  function buildNewWeekdayPills(){
    var wrap = document.getElementById('new-weekdays');
    wrap.innerHTML='';
    WD_LABELS.forEach(function(lbl, idx){
      var b = document.createElement('button');
      b.type='button'; b.textContent = lbl;
      b.addEventListener('click', function(){
        var pos = state.newWeekdays.indexOf(idx);
        if(pos===-1){ state.newWeekdays.push(idx); b.className='sel'; }
        else { state.newWeekdays.splice(pos,1); b.className=''; }
      });
      wrap.appendChild(b);
    });
  }

  /* ---------- Mascot image upload (supports multiple slots, resizable) ---------- */
  var DEFAULT_MASCOT_SVG =
    '<svg class="mascot" width="100%" height="100%" viewBox="0 0 56 54">' +
      '<ellipse cx="28" cy="30" rx="22" ry="19" fill="#FFF3EC" stroke="#E8B9A8" stroke-width="2"/>' +
      '<ellipse cx="10" cy="32" rx="5.5" ry="6" fill="#FFF3EC" stroke="#E8B9A8" stroke-width="2"/>' +
      '<ellipse cx="46" cy="32" rx="5.5" ry="6" fill="#FFF3EC" stroke="#E8B9A8" stroke-width="2"/>' +
      '<ellipse cx="18" cy="16" rx="7" ry="4" fill="#ffffff" opacity="0.6"/>' +
      '<circle cx="21" cy="30" r="1.9" fill="#6B5560"/>' +
      '<circle cx="35" cy="30" r="1.9" fill="#6B5560"/>' +
      '<ellipse cx="15" cy="35" rx="3" ry="2" fill="#FFC2D1" opacity="0.8"/>' +
      '<ellipse cx="41" cy="35" rx="3" ry="2" fill="#FFC2D1" opacity="0.8"/>' +
      '<path d="M24 35 Q28 38 32 35" stroke="#6B5560" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '</svg>';

  function mascotSlotHtml(id, size){
    return ''+
    '<div class="mascot-slot">'+
      '<div class="mascot-wrap" id="mascot-wrap-'+id+'" style="width:'+size+'px;height:'+size+'px;" title="クリックして画像を変更">'+
        '<span id="mascot-default-'+id+'">'+DEFAULT_MASCOT_SVG+'</span>'+
        '<img class="mascot" id="mascot-custom-'+id+'" alt="マスコット画像" style="display:none;width:100%;height:100%;">'+
        '<button class="mascot-reset-btn" id="mascot-reset-btn-'+id+'" title="元に戻す" aria-label="マスコットを元に戻す" style="display:none;">×</button>'+
        '<input type="file" id="mascot-file-input-'+id+'" accept="image/*" style="display:none;">'+
      '</div>'+
    '</div>';
  }

  function openCropModal(file, onConfirm){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var STAGE = 320;
        var overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.id = 'crop-overlay';
        overlay.innerHTML =
          '<div class="modal">'+
            '<h2>画像を切り抜く</h2>'+
            '<div class="crop-stage" id="crop-stage">'+
              '<img id="crop-img" src="'+ev.target.result+'">'+
              '<div class="crop-hint"></div>'+
            '</div>'+
            '<div class="crop-controls"><span style="font-size:12px;color:var(--ink-soft);">拡大縮小</span><input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></div>'+
            '<div class="modal-actions"><div></div><div class="right">'+
              '<button class="btn-secondary" id="crop-cancel">キャンセル</button>'+
              '<button class="btn-primary" id="crop-confirm">この範囲で決定</button>'+
            '</div></div>'+
          '</div>';
        document.body.appendChild(overlay);

        var stage = document.getElementById('crop-stage');
        var cimg = document.getElementById('crop-img');
        var zoomSlider = document.getElementById('crop-zoom');
        // 画面幅に合わせた実際の枠サイズ（スマホでは320pxより小さくなる）
        STAGE = Math.round(stage.getBoundingClientRect().width) || 320;
        var naturalW = img.naturalWidth, naturalH = img.naturalHeight;
        var baseScale = STAGE / Math.min(naturalW, naturalH);
        var zoom = 1, tx = 0, ty = 0;

        function clampAndRender(){
          var scale = baseScale * zoom;
          var dw = naturalW*scale, dh = naturalH*scale;
          if(dw >= STAGE){
            var minTx = STAGE - dw;
            tx = Math.min(0, Math.max(minTx, tx));
          } else {
            tx = (STAGE - dw)/2;
          }
          if(dh >= STAGE){
            var minTy = STAGE - dh;
            ty = Math.min(0, Math.max(minTy, ty));
          } else {
            ty = (STAGE - dh)/2;
          }
          cimg.style.width = dw+'px';
          cimg.style.height = dh+'px';
          cimg.style.transform = 'translate('+tx+'px,'+ty+'px)';
        }
        function centerImage(){
          var scale = baseScale * zoom;
          var dw = naturalW*scale, dh = naturalH*scale;
          tx = (STAGE-dw)/2; ty = (STAGE-dh)/2;
          clampAndRender();
        }
        centerImage();

        // 指定した点(枠内座標)を中心に拡大縮小する。見ている場所がずれない
        function setZoom(newZoom, cx, cy){
          newZoom = Math.min(4, Math.max(1, newZoom));
          if(cx === undefined){ cx = STAGE/2; cy = STAGE/2; }
          var ratio = newZoom / zoom;
          tx = cx - (cx - tx) * ratio;
          ty = cy - (cy - ty) * ratio;
          zoom = newZoom;
          zoomSlider.value = String(zoom);
          clampAndRender();
        }

        // 1本指でドラッグ移動、2本指でピンチ拡大縮小
        var pointers = {};
        var pinchStartDist = 0, pinchStartZoom = 1;
        function stagePoint(x, y){ var r = stage.getBoundingClientRect(); return {x:x - r.left, y:y - r.top}; }
        function twoPointers(){ var ids = Object.keys(pointers); return ids.length >= 2 ? [pointers[ids[0]], pointers[ids[1]]] : null; }
        stage.addEventListener('pointerdown', function(e){
          e.preventDefault();
          pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
          try{ stage.setPointerCapture(e.pointerId); }catch(err){}
          var tp = twoPointers();
          if(tp){ pinchStartDist = Math.hypot(tp[0].x-tp[1].x, tp[0].y-tp[1].y) || 1; pinchStartZoom = zoom; }
        });
        stage.addEventListener('pointermove', function(e){
          var prev = pointers[e.pointerId];
          if(!prev) return;
          e.preventDefault();
          var tp = twoPointers();
          if(tp){
            pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
            tp = twoPointers();
            var dist = Math.hypot(tp[0].x-tp[1].x, tp[0].y-tp[1].y);
            var mid = stagePoint((tp[0].x+tp[1].x)/2, (tp[0].y+tp[1].y)/2);
            setZoom(pinchStartZoom * dist / pinchStartDist, mid.x, mid.y);
          } else {
            tx += (e.clientX - prev.x); ty += (e.clientY - prev.y);
            pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
            clampAndRender();
          }
        });
        function endPointer(e){
          delete pointers[e.pointerId];
          var tp = twoPointers();
          if(!tp){ pinchStartDist = 0; }
        }
        stage.addEventListener('pointerup', endPointer);
        stage.addEventListener('pointercancel', endPointer);
        stage.addEventListener('wheel', function(e){
          e.preventDefault();
          var pt = stagePoint(e.clientX, e.clientY);
          setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1/1.08), pt.x, pt.y);
        }, {passive:false});
        zoomSlider.addEventListener('input', function(){
          setZoom(parseFloat(this.value));
        });

        function close(){ overlay.remove(); }
        overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
        document.getElementById('crop-cancel').addEventListener('click', close);
        document.getElementById('crop-confirm').addEventListener('click', function(){
          var scale = baseScale * zoom;
          var OUT = 320;
          var canvas = document.createElement('canvas');
          canvas.width = OUT; canvas.height = OUT;
          var ctx = canvas.getContext('2d');
          var sx = (0 - tx) / scale, sy = (0 - ty) / scale;
          var sSize = STAGE / scale;
          ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUT, OUT);
          var dataUrl = canvas.toDataURL('image/webp', 0.85); if(dataUrl.indexOf('data:image/webp')!==0) dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          close();
          onConfirm(dataUrl);
        });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function initMascotSlot(id, defaultSize){
    var target = document.getElementById('mascot-slot-'+id);
    if(!target) return;
    target.innerHTML = mascotSlotHtml(id, defaultSize);

    var imgKey = 'mascotImage_'+id;
    var wrapEl = document.getElementById('mascot-wrap-'+id);
    var defaultEl = document.getElementById('mascot-default-'+id);
    var customEl = document.getElementById('mascot-custom-'+id);
    var resetBtn = document.getElementById('mascot-reset-btn-'+id);
    var fileInput = document.getElementById('mascot-file-input-'+id);

    function showCustom(dataUrl){
      customEl.src = dataUrl;
      customEl.style.display = 'block';
      defaultEl.style.display = 'none';
      resetBtn.style.display = 'flex';
    }
    function showDefault(){
      customEl.style.display = 'none';
      defaultEl.style.display = 'block';
      resetBtn.style.display = 'none';
    }

    wrapEl.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if(!file) return;
      openCropModal(file, async function(dataUrl){
        showCustom(dataUrl);
        try{ await storageAdapter.set(imgKey, dataUrl, false); }
        catch(err){ console.error('mascot upload failed', err); }
      });
    });
    resetBtn.addEventListener('click', async function(e){
      e.stopPropagation();
      showDefault();
      try{ await storageAdapter.delete(imgKey, false); }catch(err){ /* ignore */ }
    });

    (async function(){
      try{
        var ires = await storageAdapter.get(imgKey, false);
        if(ires && ires.value) showCustom(ires.value);
      }catch(e){ /* no custom mascot saved */ }
    })();
  }

  initMascotSlot('header', 80);
  initMascotSlot('urgent', 56);
  initMascotSlot('tabs', 56);


  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ state.view = b.getAttribute('data-view'); renderAll(); });
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ state.filter = c.getAttribute('data-filter'); renderAll(); });
  });
  document.getElementById('search-input').addEventListener('input', function(){
    state.search = this.value.trim().toLowerCase();
    renderAll();
  });
  document.querySelectorAll('#new-type-toggle button').forEach(function(b){
    b.addEventListener('click', function(){
      state.newType = b.getAttribute('data-type');
      document.querySelectorAll('#new-type-toggle button').forEach(function(x){ x.className=''; });
      b.className = state.newType==='must' ? 'sel-must' : 'sel-want';
    });
  });
  document.getElementById('new-urgent-toggle').addEventListener('click', function(){
    state.newUrgent = !state.newUrgent;
    this.classList.toggle('on', state.newUrgent);
  });
  document.getElementById('new-repeat').addEventListener('change', updateRepeatControlsVisibility);
  document.getElementById('add-btn').addEventListener('click', addTask);
  document.getElementById('new-title').addEventListener('keydown', function(e){ if(e.key==='Enter') addTask(); });
  document.getElementById('add-detail-toggle').addEventListener('click', function(){
    var row = document.getElementById('add-row2');
    var expanded = row.style.display !== 'none';
    row.style.display = expanded ? 'none' : 'flex';
    this.textContent = expanded ? '▼ 繰り返し・詳細設定' : '▲ 繰り返し・詳細設定を閉じる';
  });

  buildNewWeekdayPills();
  updateRepeatControlsVisibility();
  loadTasks();

  /* ---------- 他の端末の変更を取り込む（画面に戻ったとき・状態表示をタップしたとき） ---------- */
  var lastPull = 0;
  async function pullRemote(force){
    if(saveInProgress || (!force && Date.now() - lastPull < 5000)) return;
    lastPull = Date.now();
    try{
      var merged = await mergeWithRemoteBeforeSave();
      if(merged.hadRemoteChanges && !saveInProgress){
        state.tasks = merged.tasks;
        state.tombstones = merged.tombstones;
        renderAll();
      }
      if(!saveInProgress) setSyncStatus('saved', merged.hadRemoteChanges ? '最新の内容を読み込みました' : '最新です');
    }catch(e){ /* 次回に再試行 */ }
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') pullRemote(); });
  window.addEventListener('focus', function(){ pullRemote(); });
  setInterval(function(){ if(document.visibilityState === 'visible') pullRemote(); }, 60000);
  document.getElementById('sync-status').addEventListener('click', function(e){
    if(e.target && e.target.id === 'sync-retry-btn') return;
    pullRemote(true);
  });

  /* ---------- 日付をまたいだ場合の自動更新(項目13) ----------
     ページを開いたまま0時をまたいでも、何か操作するまで「今日」の表示
     （カレンダーのtoday枠、繰り返しタスクの今日の完了状態、直近7日、なるはや）
     が古いままになってしまう。1分ごとに日付が変わっていないか確認し、
     変わっていれば自動的に再描画する。 */
  var lastKnownToday = todayStr();
  setInterval(function(){
    var nowToday = todayStr();
    if(nowToday !== lastKnownToday){
      lastKnownToday = nowToday;
      renderAll();
    }
  }, 60000);
})();
</script>
