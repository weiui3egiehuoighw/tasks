<style>
  :root{
    --ink:#6B5560;
    --ink-soft:#A8929B;
    --bg:#FFF6F3;
    --card:#FFFFFF;
    --card-tint:#FFFBF8;
    --line:#F5DFE3;
    /* --brand: アプリ全体の見出し・主要ボタン・タブなどのブランド色（タスク種別の色とは別管理） */
    --brand:#FF6F91;
    --brand-light:#FFE3EB;
    /* --must: 📌やらなきゃ の色。薄い赤／コーラル系。危険色ではなく「やるべきこと」を示す */
    --must:#FF7A66;
    --must-light:#FFE2DB;
    --must-text:#C94A36;
    /* --want: 🌸やりたい の色。ピンク系 */
    --want:#E874B0;
    --want-light:#FDE3F1;
    --want-text:#A83E75;
    /* --urgent: ⏰なるはや の色。やらなきゃより一段強い赤系 */
    --urgent:#E8555A;
    --urgent-light:#FFDBDA;
    /* --warn: 保存中など、タスク種別とは無関係な「注意・進行中」の表示に使う（旧--want跡地） */
    --warn:#E0A526;
    --warn-light:#FFF1CE;
    --mint:#3FB88A;
    --mint-light:#DFF7EC;
    --lav:#9C86D8;
    --lav-light:#EEE7FB;
    --peach:#FF8E5A;
    --peach-light:#FFEBDD;
    --shadow:0 3px 10px rgba(255,143,163,0.16);
    --shadow-sm:0 2px 6px rgba(155,120,140,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 0%, #FFE9EF 0%, transparent 45%),
      radial-gradient(circle at 100% 12%, #FFF3DC 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'M PLUS Rounded 1c', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;padding:28px 20px 60px;}

  header{margin-bottom:20px;}
  .brand-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .mascot{flex-shrink:0;filter:drop-shadow(0 3px 4px rgba(255,143,163,0.25));display:block;}
  .mascot-slot{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .mascot-wrap{position:relative;flex-shrink:0;cursor:pointer;}
  .mascot-wrap img.mascot{object-fit:cover;border-radius:50%;background:#fff;}
  .mascot-reset-btn{
    position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;
    background:var(--brand);color:#fff;font-size:10px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--shadow-sm);
    opacity:0;transition:opacity 0.15s ease;
  }
  .mascot-wrap:hover .mascot-reset-btn{opacity:1;}

  /* Crop modal */
  .crop-stage{
    position:relative;width:min(320px,100%);aspect-ratio:1/1;margin:0 auto;overflow:hidden;border-radius:16px;
    background:#f0e9e4;touch-action:none;border:2px solid var(--line);
  }
  .crop-stage img{position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .crop-hint{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,0.28);pointer-events:none;margin:14px;}
  .crop-controls{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .crop-controls input[type=range]{flex:1;}
  h1{font-family:'Zen Maru Gothic', sans-serif;font-weight:900;font-size:26px;margin:0;color:var(--brand);letter-spacing:0.02em;}
  .tagline{font-size:13px;color:var(--ink-soft);margin:6px 0 0;line-height:1.7;font-weight:500;}

  .sync-status{cursor:pointer;font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:12px;background:var(--card-tint);color:var(--ink-soft);width:fit-content;}
  .sync-status.saving{background:var(--warn-light);color:#946816;}
  .sync-status.saved{background:var(--mint-light);color:#1F7A56;}
  .sync-status.error{background:var(--brand-light);color:#C0294A;}
  .sync-status .sync-note{font-weight:600;opacity:0.85;}
  .sync-status button{border:none;background:#fff;color:#C0294A;border-radius:14px;padding:3px 10px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;}

  .undo-toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#3A2E33;color:#fff;padding:12px 16px;border-radius:16px;
    display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,0.28);z-index:999;max-width:92vw;
  }
  .undo-toast button{
    background:var(--peach);color:#fff;border:none;border-radius:20px;padding:6px 14px;
    font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;
  }

  .field-error{color:var(--brand);font-size:11.5px;font-weight:700;margin-top:4px;display:block;}
  .hint-inline{color:var(--ink-soft);font-size:10.5px;font-weight:500;margin-left:6px;}

  .urgent-panel{
    background:var(--urgent-light);
    border:2px dashed #FFB8B5;
    border-radius:20px;
    padding:16px 18px;
    margin:22px 0;
  }
  .urgent-panel h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px;margin:0 0 10px;color:#B23A3E;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  .urgent-list{display:flex;flex-direction:column;gap:8px;}
  .urgent-row{
    background:#fff;border:1px solid #FFC9C7;border-radius:14px;padding:9px 12px;
    display:flex;align-items:center;gap:10px;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform 0.12s ease;
  }
  .urgent-row:hover{transform:translateY(-1px) scale(1.01);}
  .urgent-row .ut{flex:1;font-size:13.5px;font-weight:700;}
  .urgent-row .ud{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-weight:500;}
  .urgent-row .done-btn{
    border:none;background:var(--urgent);color:#fff;border-radius:20px;
    font-size:11px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:700;font-family:inherit;
    transition:transform 0.12s ease;
  }
  .urgent-row .done-btn:hover{transform:scale(1.07);}
  .urgent-empty{font-size:12.5px;color:#B25A57;font-weight:500;}

  .soon-panel{
    background:var(--mint-light);
    border:2px dashed #9EDFC2;
    border-radius:20px;
    padding:16px 18px;
    margin:22px 0;
  }
  .soon-panel h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px;margin:0 0 10px;color:#1F7A56;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  .soon-list{display:flex;flex-direction:column;gap:8px;}
  .soon-row{
    background:#fff;border:1px solid #BEEAD4;border-radius:14px;padding:9px 12px;
    display:flex;align-items:center;gap:10px;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform 0.12s ease;
  }
  .soon-row:hover{transform:translateY(-1px) scale(1.01);}
  .soon-row.is-today{background:var(--mint-light);border:2px solid var(--mint);box-shadow:0 3px 12px rgba(63,184,138,0.22);}
  .soon-row.is-today .ut{font-weight:800;}
  .soon-row .ut{flex:1;font-size:13.5px;font-weight:700;}
  .soon-row .ud{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;font-weight:500;}
  .soon-row .badge-daytag{font-size:10.5px;font-weight:700;color:#1F7A56;background:#DFF7EC;border-radius:10px;padding:2px 7px;white-space:nowrap;}
  .soon-row .badge-daytag.today{color:#fff;background:var(--mint);font-weight:800;}
  .soon-row .done-btn{
    border:none;background:var(--mint);color:#fff;border-radius:20px;
    font-size:11px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-weight:700;font-family:inherit;
    transition:transform 0.12s ease;
  }
  .soon-row .done-btn:hover{transform:scale(1.07);}
  .soon-empty{font-size:12.5px;color:#2E9468;font-weight:500;}

  .tabs{display:flex;align-items:center;gap:6px;margin:6px 0 18px;}
  .tab-btn{
    background:var(--card);border:2px solid var(--line);font-family:'M PLUS Rounded 1c',sans-serif;
    font-size:13.5px;color:var(--ink-soft);padding:9px 18px;cursor:pointer;font-weight:700;
    border-radius:24px;transition:transform 0.12s ease;
  }
  .tab-btn:hover{transform:translateY(-1px);}
  .tab-btn.active{color:#fff;background:var(--brand);border-color:var(--brand);}

  .add-bar{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow-sm);}
  .add-row1{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .add-row1 input[type=text]{flex:1 1 220px;min-width:160px;}
  .add-row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:2px dotted var(--line);}
  label.mini{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;font-weight:600;}
  .detail-toggle-btn{background:none;border:none;color:var(--lav);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:8px 2px 0;display:block;}
  .detail-toggle-btn:hover{text-decoration:underline;}
  input[type=text], input[type=date], input[type=number], select, textarea{
    font-family:inherit;font-size:14px;color:var(--ink);background:var(--card-tint);border:2px solid var(--line);
    border-radius:14px;padding:9px 12px;
  }
  input[type=text]:focus, input[type=date]:focus, input[type=number]:focus, select:focus, textarea:focus{outline:none;border-color:var(--lav);}
  .type-toggle{display:flex;border:2px solid var(--line);border-radius:20px;overflow:hidden;}
  .type-toggle button{border:none;background:var(--card-tint);font-family:inherit;font-size:13px;padding:9px 14px;cursor:pointer;color:var(--ink-soft);font-weight:700;}
  .type-toggle button.sel-must{background:var(--must);color:#fff;}
  .type-toggle button.sel-want{background:var(--want-light);color:var(--want-text);}
  .toggle-pill{
    border:2px solid var(--line);background:var(--card-tint);border-radius:20px;padding:9px 14px;font-size:13px;
    cursor:pointer;color:var(--ink-soft);font-family:inherit;font-weight:700;transition:transform 0.12s ease;
  }
  .toggle-pill:hover{transform:translateY(-1px);}
  .toggle-pill.on{background:var(--urgent);border-color:var(--urgent);color:#fff;}
  .btn-primary{background:var(--brand);color:#fff;border:none;border-radius:20px;padding:10px 22px;font-family:inherit;font-size:14px;cursor:pointer;font-weight:700;transition:transform 0.12s ease;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{transform:translateY(-1px) scale(1.02);}
  .weekday-pills{display:flex;gap:5px;flex-wrap:wrap;}
  .weekday-pills button{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card-tint);
    font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-weight:700;
  }
  .weekday-pills button.sel{background:var(--lav);color:#fff;border-color:var(--lav);}

  .search-bar{margin:6px 0 14px;}
  .search-bar input{width:100%;padding:11px 16px;border-radius:16px;border:2px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--card);color:var(--ink);}
  .search-bar input:focus{outline:none;border-color:var(--lav);}
  .filters{display:flex;gap:8px;margin-bottom:18px;}
  .chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 16px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-weight:700;transition:transform 0.12s ease;}
  .chip:hover{transform:translateY(-1px);}
  .chip.active{background:var(--lav);color:#fff;border-color:var(--lav);}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  @keyframes calFadeIn{
    from{ opacity:0; transform:translateY(8px) scale(0.985); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .cal-fade.cal-fade-anim{ animation: calFadeIn 0.32s cubic-bezier(0.22,1,0.36,1); }
  .cal-nav .month-label{font-family:'Zen Maru Gothic',sans-serif;font-size:18px;font-weight:700;color:var(--brand);}
  .cal-nav button{background:var(--card);border:2px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--brand);font-weight:700;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-weight:700;}
  .weekdays span:first-child{color:var(--brand);}
  .weekdays span:last-child{color:var(--lav);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-cell{
    background:var(--card);border:2px solid var(--line);border-radius:14px;min-height:74px;padding:6px;
    cursor:pointer;position:relative;display:flex;flex-direction:column;gap:5px;transition:transform 0.12s ease;
  }
  .cal-cell:not(.muted):hover{transform:scale(1.04);border-color:var(--lav);}
  .cal-cell.muted{background:transparent;border-color:transparent;cursor:pointer;opacity:0.55;}
  .cal-cell.muted:hover{opacity:0.9;}
  .cal-cell.sun{background:#FFE6E9;}
  .cal-cell.sat{background:#E6F0FB;}
  .cal-cell.today{border-color:var(--lav);border-width:2.5px;}
  .cal-cell.selected{border-color:var(--mint);border-width:2.5px;box-shadow:0 0 0 2px var(--mint-light);}
  .cal-daynum{font-size:12.5px;color:var(--ink-soft);font-weight:700;}
  .cal-cell.today .cal-daynum{color:var(--lav);font-weight:800;}
  .dot-row{display:flex;flex-wrap:wrap;gap:2.5px;align-items:center;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--ink-soft);}
  .dot.t-must{background:var(--must);}
  .dot.t-want{background:var(--want);}
  .dot.repeat:not(.done){border:2.5px solid;background:transparent;}
  .dot.repeat.t-must:not(.done){border-color:var(--must);}
  .dot.repeat.t-want:not(.done){border-color:var(--want);}
  /* 完了時は色を変えず、同じ色味のまま薄くするだけにする */
  .dot.done{border:none;}
  .dot.done.t-must{background:var(--must-light);}
  .dot.done.t-want{background:var(--want-light);}
  .more-num{font-size:10px;color:var(--ink-soft);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .more-num:hover{color:var(--lav);}

  .day-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .day-item{background:var(--card-tint);border:2px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap;}
  .day-item .dit{flex:1;font-size:13px;font-weight:600;min-width:60px;}
  .day-item .dit.done{opacity:0.5;text-decoration:line-through;}
  .day-item .done-btn{font-size:10.5px;padding:5px 10px;background:var(--mint);}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .board-col{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;min-height:120px;}
  .board-col.col-todo{background:var(--card);}
  .board-col.col-doing{background:var(--warn-light);border-color:#F3DFA8;}
  .board-col.col-followup{background:var(--peach-light);border-color:#FFD2AE;}
  .board-col.col-done{background:var(--mint-light);border-color:#BEEAD4;}
  .task-card.is-done{opacity:0.82;}
  .board-col h3{font-family:'Zen Maru Gothic',sans-serif;font-size:12.5px;font-weight:700;margin:2px 4px 12px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;}
  .col-count{background:var(--lav-light);color:var(--lav);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;}
  .archive-link{display:block;width:100%;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:7px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;margin-bottom:9px;}
  .archive-link:hover{border-color:var(--lav);color:var(--lav);}
  .archive-btn{width:100%;margin-top:8px;border:none;background:var(--lav-light);color:var(--lav);border-radius:10px;padding:5px 8px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .archive-btn:hover{background:var(--lav);color:#fff;}
  .task-card{background:var(--card-tint);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:9px;cursor:pointer;position:relative;box-shadow:var(--shadow-sm);transition:transform 0.12s ease;}
  .task-card:hover{border-color:var(--lav);transform:translateY(-1px);}
  .task-card .tt{font-size:13.5px;font-weight:800;margin:0 0 4px;line-height:1.4;padding-right:32px;color:var(--ink);}
  .task-card.is-done .tt{opacity:0.55;text-decoration:line-through;}
  /* ②今日やるべきか／期限：タイトルの次に重要な情報として、バッジより目立つ普通の文字で表示する */
  .card-when{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:0 0 7px;display:flex;align-items:center;gap:4px;}
  .card-when.emph{color:var(--urgent);font-weight:800;}
  .card-when.done-emph{color:#1F7A56;}
  .task-meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);flex-wrap:wrap;font-weight:600;}
  .card-done-toggle{
    position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;
    border:2px solid var(--ink-soft);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;padding:0;color:var(--ink-soft);transition:transform 0.12s ease,background 0.12s ease,border-color 0.12s ease;
    box-shadow:var(--shadow-sm);
  }
  .card-done-toggle:hover{transform:scale(1.14);border-color:var(--mint);color:var(--mint);}
  .task-card.is-done .card-done-toggle{background:var(--mint);border-color:var(--mint);color:#fff;}
  .badge{padding:2px 9px;border-radius:12px;font-size:10.5px;font-weight:700;}
  .badge.must{background:var(--must);color:#fff;}
  .badge.want{background:var(--want-light);color:var(--want-text);}
  .badge.urgent{background:var(--urgent);color:#fff;}
  .badge.repeat{background:var(--lav-light);color:var(--lav);}
  /* ④繰り返し・優先などの副次情報は、フルバッジではなく小さなアイコンだけにして視覚的な重みを下げる */
  .mini-icon-badge{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:10.5px;background:var(--card);border:1.5px solid var(--line);flex-shrink:0;cursor:default;}
  .mini-icon-badge.urgent{background:var(--urgent-light);border-color:var(--urgent);}
  .mini-icon-badge.repeat{background:var(--lav-light);border-color:var(--lav);}
  .hanko-mark{
    position:absolute;top:-6px;right:-6px;width:34px;height:34px;border-radius:50%;
    background:var(--mint);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic',sans-serif;font-size:14px;font-weight:700;
    transform:rotate(10deg);box-shadow:0 2px 6px rgba(63,184,138,0.4);
    animation:stampPop 0.3s ease;
  }
  @keyframes stampPop{ 0%{transform:rotate(10deg) scale(0);} 70%{transform:rotate(10deg) scale(1.15);} 100%{transform:rotate(10deg) scale(1);} }
  .empty-note{color:var(--ink-soft);font-size:12px;text-align:center;padding:20px 4px;font-weight:600;}

  .overlay{position:fixed;inset:0;background:rgba(107,85,96,0.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--card);border-radius:26px;padding:24px 26px;width:100%;max-width:440px;border:2px solid var(--line);max-height:88vh;overflow-y:auto;box-shadow:0 12px 30px rgba(107,85,96,0.2);}
  .modal h2{font-family:'Zen Maru Gothic',sans-serif;font-size:18px;margin:0 0 16px;color:var(--brand);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:56px;}
  .status-row{display:flex;gap:6px;flex-wrap:wrap;}
  .status-row button{flex:1;min-width:70px;border:2px solid var(--line);background:var(--card-tint);border-radius:16px;padding:8px 4px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-weight:700;}
  .status-row button.sel{background:var(--lav);color:#fff;border-color:var(--lav);}
  .repeat-done-note{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6;background:var(--lav-light);border-radius:12px;padding:8px 10px;}
  .history-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .history-chip{font-size:11px;font-weight:700;color:var(--mint);background:var(--mint-light);border-radius:10px;padding:3px 9px;}
  .history-more{font-size:11px;font-weight:700;color:var(--ink-soft);padding:3px 4px;}
  .repeat-status-box{background:var(--card-tint);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .rsb-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;}
  .rsb-label{color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .rsb-value{font-weight:700;text-align:right;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .btn-text{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;}
  .btn-text.danger{color:var(--urgent);}
  .modal-actions .right{display:flex;gap:8px;}
  .btn-secondary{background:var(--card-tint);border:2px solid var(--line);border-radius:20px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:700;}
  .inline-toggle{display:flex;align-items:center;gap:8px;}

  @media (max-width:640px){
    .board{grid-template-columns:1fr 1fr;}
    .cal-cell{min-height:56px;}
  }
  /* ---- スマホ（タッチ操作）向け調整 ---- */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;}
  button,[data-daycell],[data-cardid],[data-morecell],[data-jumpcell],[data-openid],.urgent-row,.soon-row,.task-card,.day-item,.mascot-wrap,.chip,.tab-btn{
    touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,111,145,0.18);
  }
  .overlay{overscroll-behavior:contain;}
  .modal{max-height:88dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  @media (hover:none), (pointer:coarse){
    /* タップ後に残る:hover効果で要素がずれて、次のタップが外れるのを防ぐ */
    .urgent-row:hover,.soon-row:hover,.done-btn:hover,.tab-btn:hover,.toggle-pill:hover,.btn-primary:hover,.chip:hover,.cal-cell:hover,.task-card:hover,.card-done-toggle:hover{transform:none !important;}
    .cal-cell:not(.muted):hover{border-color:var(--line);}
    button,[data-daycell],[data-cardid],[data-morecell],[data-jumpcell],[data-openid],.urgent-row,.soon-row,.task-card,.day-item,.chip,.tab-btn{
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    }
    input,select,textarea{font-size:16px !important;}
    .overlay{padding:12px;}
    .modal{padding:20px 18px;}
    .mascot-reset-btn{display:none !important;}
    .done-btn{min-height:36px;padding:6px 12px !important;font-size:12px !important;}
    .card-done-toggle{width:36px;height:36px;top:4px;right:4px;font-size:16px;}
    .task-card .tt{padding-right:40px;}
    .cal-nav button{width:44px;height:44px;font-size:18px;}
    .chip{padding:9px 16px;}
    .weekday-pills button{width:38px;height:38px;font-size:13px;}
    .archive-btn,.archive-link{padding:10px 8px;font-size:12px;}
    .more-num{display:inline-block;padding:4px 6px;margin:-4px -6px;font-size:11px;}
    .detail-toggle-btn,#add-detail-toggle,.import-link{padding:10px 4px;}
    #m-delete{padding:10px 12px;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="brand-row">
      <div id="mascot-slot-header" class="mascot-slot-target"></div>
      <div>
        <h1>四象タスク帳</h1>
        <div class="tagline">やる／やらなきゃ × 手つかず／進行中／要フォロー／完了</div>
        <div class="sync-status" id="sync-status"></div>
      </div>
    </div>
  </header>

  <div class="urgent-panel">
    <h2><span id="mascot-slot-urgent" class="mascot-slot-target"></span>⏰ なるはや（優先表示タスク・カレンダーには出さず上部に常時表示）</h2>
    <div class="urgent-list" id="urgent-list"></div>
  </div>

  <div class="soon-panel">
    <h2>📅 直近のタスク（今日から7日以内）</h2>
    <div class="soon-list" id="soon-list"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn" data-view="calendar">🗓️ カレンダー</button>
    <button class="tab-btn" data-view="board">🗂️ ボード</button>
    <div id="mascot-slot-tabs" class="mascot-slot-target" style="margin-left:auto;"></div>
  </div>

  <div class="add-bar">
    <div class="add-row1">
      <input type="text" id="new-title" placeholder="タスクを入力（例：撮影位置図面の見直し）">
      <div class="type-toggle" id="new-type-toggle">
        <button data-type="must" class="sel-must">📌やらなきゃ</button>
        <button data-type="want">🌸やりたい</button>
      </div>
      <label class="mini">日付<input type="date" id="new-date" style="margin-left:2px;"></label>
      <button class="toggle-pill" id="new-urgent-toggle">⏰なるはや</button>
      <button class="btn-primary" id="add-btn">＋追加</button>
    </div>
    <button type="button" id="add-detail-toggle" class="detail-toggle-btn">▼ 繰り返し・詳細設定</button>
    <div class="add-row2" id="add-row2" style="display:none;">
      <label class="mini">繰り返し
        <select id="new-repeat" style="margin-left:2px;">
          <option value="none">なし（単発）</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
        </select>
      </label>
      <div class="weekday-pills" id="new-weekdays" style="display:none;"></div>
      <label class="mini" id="new-monthday-wrap" style="display:none;">毎月<input type="number" id="new-monthday" min="1" max="31" style="width:56px;margin-left:2px;">日<span class="hint-inline">※月末がない場合は月末扱い</span></label>
      <label class="mini" id="new-adjust-wrap" style="display:none;">土日祝なら
        <select id="new-adjust" style="margin-left:2px;">
          <option value="none">そのまま</option>
          <option value="before">前営業日</option>
          <option value="after">翌営業日</option>
        </select>
      </label>
      <label class="mini" id="new-repeatstart-wrap" style="display:none;">開始日<input type="date" id="new-repeat-start" style="margin-left:2px;"></label>
      <label class="mini" id="new-repeatend-wrap" style="display:none;">終了日（任意）<input type="date" id="new-repeat-end" style="margin-left:2px;"></label>
      <span id="new-weekday-error" class="field-error" style="display:none;">⚠️ 毎週の場合は曜日を1つ以上選択してください</span>
      <span id="new-range-error" class="field-error" style="display:none;">⚠️ 開始日は終了日より前の日付にしてください</span>
    </div>
  </div>

  <div class="search-bar">
    <input type="search" id="search-input" placeholder="🔍 タイトル・メモで検索">
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">すべて</button>
    <button class="chip" data-filter="must">📌やらなきゃ</button>
    <button class="chip" data-filter="want">🌸やりたい</button>
  </div>

  async function loadTasks(){
    try{
      var res = await storageAdapter.get(STORAGE_KEY, false);

      if(!t.doneMap || typeof t.doneMap !== 'object' || Array.isArray(t.doneMap)) t.doneMap = {};

      if(t.repeatEnd && typeof t.repeatEnd !== 'string') t.repeatEnd=null;
      if(t.repeatStart===undefined) t.repeatStart=null;
      if(t.repeatEnd===undefined) t.repeatEnd=null;

      // （繰り返しタスクの完了は日付ごとのdoneMapで管理するため）
      if(t.repeat!=='none' && t.status==='done') t.status='todo';

  /* ---------- 保存前マージ(競合対策) ----------
     複数端末・タブからほぼ同時に保存された場合に、片方の変更で
     もう片方を丸ごと上書きしてしまわないよう、保存直前に最新のリモート
     データを取得し、タスクごとにupdatedAtを比較して統合する。
     削除は tombstones（削除記録）で管理し、削除後に古いリモートデータが
     復活してしまわないようにする。
     完全なCRDTではないが、「全体を無条件PUT」よりは大幅に安全。 */
  async function mergeWithRemoteBeforeSave(){
    var remoteTasks = [];
    var remoteTombstones = [];
    try{
      var res = await storageAdapter.get(STORAGE_KEY, false, true);
      remoteTasks = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ remoteTasks = []; }
    try{
      var resT = await storageAdapter.get(STORAGE_KEY_TOMBSTONES, false, true);
      remoteTombstones = resT && resT.value ? JSON.parse(resT.value) : [];
    }catch(e){ remoteTombstones = []; }

    var localTasks = state.tasks;
    var localTombstones = state.tombstones || [];

    var tombMap = {};
    localTombstones.concat(remoteTombstones).forEach(function(tomb){
      if(!tomb || !tomb.id) return;
      if(!tombMap[tomb.id] || tomb.deletedAt > tombMap[tomb.id].deletedAt) tombMap[tomb.id] = tomb;
    });

    var localMap = {}; localTasks.forEach(function(t){ localMap[t.id]=t; });
    var remoteMap = {}; remoteTasks.forEach(function(t){ remoteMap[t.id]=t; });
    var allIds = Object.keys(localMap).concat(Object.keys(remoteMap)).filter(function(id, idx, arr){ return arr.indexOf(id)===idx; });

    var mergedTasks = [];
    var hadRemoteChanges = false;

    allIds.forEach(function(id){
      var lt = localMap[id], rt = remoteMap[id];
      var tomb = tombMap[id];
      if(tomb){
        var newestUpdate = Math.max(
          lt ? (Date.parse(lt.updatedAt)||0) : 0,
          rt ? (Date.parse(rt.updatedAt)||0) : 0
        );
        if(Date.parse(tomb.deletedAt) >= newestUpdate){
          if(rt && !lt) hadRemoteChanges = true;
          return; // 削除確定として除外
        }
      }
      if(lt && rt){
        var ltT = Date.parse(lt.updatedAt)||0, rtT = Date.parse(rt.updatedAt)||0;
        var base = rtT > ltT ? rt : lt;
        var other = rtT > ltT ? lt : rt;
        // doneMap(繰り返しタスクの日付ごとの完了/未完了記録)は、タスク全体のupdatedAtで
        // 一括採用すると「完了させた」記録だけを守ろうとして、そのあとの「取り消し」操作が
        // 巻き戻ってしまう(=完了は取り消せなくなる)。そこで日付ごとに、その日付を最後に
        // 完了/未完了にした時刻(at)を比較し、より新しい記録だけを個別に採用する。
        // これにより、他端末で記録された完了を取りこぼさず、かつ自分が押した「取り消し」も
        // きちんと反映される。
        var baseMap = base.doneMap || {};
        var otherMap = other.doneMap || {};
        var mergedMap = {};
        Object.keys(baseMap).concat(Object.keys(otherMap))
          .filter(function(d, idx, arr){ return arr.indexOf(d)===idx; })
          .forEach(function(d){
            var b = baseMap[d], o = otherMap[d];
            if(b && o) mergedMap[d] = (Date.parse(b.at)||0) >= (Date.parse(o.at)||0) ? b : o;
            else mergedMap[d] = b || o;
          });
        var mergedTask = Object.assign({}, base, { doneMap: mergedMap });
        mergedTasks.push(mergedTask);
        if(rtT > ltT || JSON.stringify(mergedMap) !== JSON.stringify(lt.doneMap||{})) hadRemoteChanges = true;
      } else if(lt && !rt){
        mergedTasks.push(lt);
      } else if(rt && !lt){
        mergedTasks.push(rt);
        hadRemoteChanges = true;
      }
    });

    var mergedTombstones = Object.keys(tombMap).map(function(k){ return tombMap[k]; });
    return { tasks: mergedTasks, tombstones: mergedTombstones, hadRemoteChanges: hadRemoteChanges };
  }

  /* ---------- 保存状態のUI表示 ---------- */
  function setSyncStatus(status, message){
    state.syncStatus = status;
    var el = document.getElementById('sync-status');
    if(!el) return;
    el.className = 'sync-status ' + status;
    if(status==='saving'){
      el.innerHTML = '💾 保存中…';
    } else if(status==='saved'){
      var now = new Date();
      var hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
      el.innerHTML = '✅ 保存済み（'+hh+':'+mm+'）' + (message ? ' <span class="sync-note">'+escapeHtml(message)+'</span>' : '');
    } else if(status==='error'){
      el.innerHTML = '⚠️ '+escapeHtml(message||'同期に失敗しました')+' <button id="sync-retry-btn" type="button">再試行</button>';
      var btn = document.getElementById('sync-retry-btn');
      if(btn) btn.addEventListener('click', function(){ saveTasks(); });
    }
  }

  /* ---------- 保存キュー(項目2) ----------
     複数の操作が短時間に発生しても、実際の保存処理(マージ+PUT)は
     常に1本ずつ順番に実行する。保存中にさらに保存要求が来た場合は
     「保存中フラグ」だけ立てておき、今の保存が終わった直後に
     もう1回だけ最新状態で保存する（要求のたびに並列実行はしない）。
     これにより、最終的には必ず最新の状態が保存される。 */
  var saveInProgress = false;
  var savePending = false;
  var saveWaiters = [];

  function saveTasks(){
    return new Promise(function(resolve){
      saveWaiters.push(resolve);
      if(saveInProgress){
        savePending = true;
        return;
      }
      runSaveLoop();
    });
  }

  async function runSaveLoop(){
    saveInProgress = true;
    do{
      savePending = false;
      var waitersForThisRun = saveWaiters;
      saveWaiters = [];
      await performSave();
      waitersForThisRun.forEach(function(resolve){ resolve(); });
    } while(savePending);
    saveInProgress = false;
  }

  async function performSave(){
    setSyncStatus('saving');
    try{
      var merged = await mergeWithRemoteBeforeSave();
      state.tasks = merged.tasks;
      state.tombstones = merged.tombstones;
      var result = await storageAdapter.set(STORAGE_KEY, JSON.stringify(state.tasks), false);
      var resultT = await storageAdapter.set(STORAGE_KEY_TOMBSTONES, JSON.stringify(state.tombstones), false);
      if(!result || !resultT){
        setSyncStatus('error', '保存できませんでした');
        return;
      }
      if(merged.hadRemoteChanges){
        setSyncStatus('saved', '他の端末の変更と統合しました');
        renderAll();
      } else {
        setSyncStatus('saved');
      }
    }catch(e){
      console.error('save failed', e);
      setSyncStatus('error', '同期に失敗しました（ネットワークを確認してください）');
    }
  }

      monthDay: repeat==='monthly' ? clampMonthDay(monthDayEl.value) : null,
